  /clans:
    get:
      tags:
        - clans
      operationId: searchClans
      summary: Search clans
      description: |
        Search all clans by name and/or filtering the results using various criteria. At least one filtering criteria must be defined and if name is used as part of search, it is required to be at least three characters long. It is not possible to specify ordering for results so clients should not rely on any specific ordering as that may change in the future releases of the API.
      parameters:
        - name: name
          in: query
          required: false
          description: Search clans by name. If name is used as part of search query, it needs to be at least three characters long. Name search parameter is interpreted as wild card search, so it may appear anywhere in the clan name.
          schema:
            type: string
        - name: warFrequency
          in: query
          required: false
          description: Filter by clan war frequency
          schema:
            type: string
        - name: locationId
          in: query
          required: false
          description: Filter by clan location identifier. For list of available locations, refer to getLocations operation.
          schema:
            type: integer
        - name: minMembers
          in: query
          required: false
          description: Filter by minimum number of clan members
          schema:
            type: integer
        - name: maxMembers
          in: query
          required: false
          description: Filter by maximum number of clan members
          schema:
            type: integer
        - name: minClanPoints
          in: query
          required: false
          description: Filter by minimum amount of clan points.
          schema:
            type: integer
        - name: minClanLevel
          in: query
          required: false
          description: Filter by minimum clan level.
          schema:
            type: integer
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/after"
        - $ref: "#/components/parameters/before"
        - name: labelIds
          in: query
          required: false
          description: Comma separatered list of label IDs to use for filtering results.
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
