components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    clanTag:
      name: clanTag
      in: path
      required: true
      description: Tag of the clan.
      schema:
        type: string
    warTag:
      name: warTag
      in: path
      required: true
      description: Tag of the war.
      schema:
        type: string
    playerTag:
      name: playerTag
      in: path
      required: true
      description: Tag of the player.
      schema:
        type: string
    leagueTierId:
      name: leagueTierId
      in: path
      required: true
      description: Identifier of the league tier.
      schema:
        type: string
    leagueId:
      name: leagueId
      in: path
      required: true
      description: Identifier of the league.
      schema:
        type: string
    seasonId:
      name: seasonId
      in: path
      required: true
      description: Identifier of the season.
      schema:
        type: string
    leagueGroupTag:
      name: leagueGroupTag
      in: path
      required: true
      description: Identifier of the league group.
      schema:
        type: string
    leagueSeasonId:
      name: leagueSeasonId
      in: path
      required: true
      description: Identifier of the league season.
      schema:
        type: string
    playerTagQuery:
      name: playerTag
      in: query
      required: true
      description: Tag of the player
      schema:
        type: string
    locationId:
      name: locationId
      in: path
      required: true
      description: Identifier of the location to retrieve.
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      description: Limit the number of items returned in the response.
      schema:
        type: integer
    after:
      name: after
      in: query
      required: false
      description: Return only items that occur after this marker. Before marker can be found from the response, inside the 'paging' property. Note that only after or before can be specified for a request, not both.
      schema:
        type: string
    before:
      name: before
      in: query
      required: false
      description: Return only items that occur before this marker. Before marker can be found from the response, inside the 'paging' property. Note that only after or before can be specified for a request, not both.
      schema:
        type: string
  responses:
    BadRequest:
      description: Client provided incorrect parameters for the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientError"
    Forbidden:
      description: Access denied, either because of missing/incorrect credentials or used API token does not grant access to the requested resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientError"
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientError"
    TooManyRequests:
      description: Request was throttled, because amount of requests was above the threshold defined for the used API token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientError"
    InternalServerError:
      description: Unknown error happened when handling the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientError"
    ServiceUnavailable:
      description: Service is temprorarily unavailable because of maintenance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientError"
  schemas:
    WarLeagueList:
